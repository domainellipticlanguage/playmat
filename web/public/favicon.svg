      <rect x="-21" y="-74" width="42" height="60" rx="7" fill="#c8452f" stroke="#14100c" stroke-width="5"/>
    </g>
    <g transform="rotate(24)">
      <rect x="-21" y="-74" width="42" height="60" rx="7" fill="#4e9a3e" stroke="#14100c" stroke-width="5"/>
    </g>
    <g transform="rotate(0)">
      <rect x="-21" y="-80" width="42" height="60" rx="7" fill="#f0e6c8" stroke="#14100c" stroke-width="5"/>
      <circle cx="0" cy="-50" r="9" fill="#c9a34a"/>
    </g>
  </g>
</svg>
