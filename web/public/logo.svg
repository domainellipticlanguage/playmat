<svg xmlns="http://www.w3.org/2000/svg" width="480" height="235" viewBox="0 0 480 235">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8c76a"/>
      <stop offset="0.55" stop-color="#c9a34a"/>
      <stop offset="1" stop-color="#8a6b2a"/>
    </linearGradient>
    <linearGradient id="cardface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#392b1a"/>
      <stop offset="1" stop-color="#20170d"/>
    </linearGradient>
  </defs>
  <!-- fan of five cards, one per color of the pentad -->
  <g transform="translate(240,150)">
    <g transform="rotate(-28)"><rect x="-32" y="-96" width="64" height="90" rx="7" fill="url(#cardface)" stroke="#d8e3e8" stroke-width="3"/><circle cx="0" cy="-51" r="11" fill="#d8e3e8"/></g>
    <g transform="rotate(-14)"><rect x="-32" y="-100" width="64" height="90" rx="7" fill="url(#cardface)" stroke="#5f8dc9" stroke-width="3"/><circle cx="0" cy="-55" r="11" fill="#5f8dc9"/></g>
    <g transform="rotate(0)"><rect x="-32" y="-102" width="64" height="90" rx="7" fill="url(#cardface)" stroke="#8f86a8" stroke-width="3"/><circle cx="0" cy="-57" r="11" fill="#8f86a8"/></g>
    <g transform="rotate(14)"><rect x="-32" y="-100" width="64" height="90" rx="7" fill="url(#cardface)" stroke="#b0483c" stroke-width="3"/><circle cx="0" cy="-55" r="11" fill="#b0483c"/></g>
    <g transform="rotate(28)"><rect x="-32" y="-96" width="64" height="90" rx="7" fill="url(#cardface)" stroke="#5d8a4e" stroke-width="3"/><circle cx="0" cy="-51" r="11" fill="#5d8a4e"/></g>
  </g>
  <text x="240" y="218" text-anchor="middle" font-family="Iowan Old Style, Palatino Linotype, Palatino, Georgia, serif" font-size="48" font-weight="bold" letter-spacing="10" fill="url(#gold)">PLAYMAT</text>
</svg>
